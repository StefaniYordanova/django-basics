{% extends 'common/base.html' %}

{% block title %}
    Delete Review | BookHub
{% endblock %}

{% block content %}

<h1>Delete Review</h1>

<p>
    Are you sure you want to delete this review?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>

    <a href="{% url 'review-detail' review.pk %}">
        Cancel
    </a>

</form>

{% endblock %}
