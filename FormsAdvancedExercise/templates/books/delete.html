{% extends 'common/base.html' %}

{% block title %}
    Delete Book | BookHub
{% endblock %}

{% block content %}

<div class="delete-container">

    <div style="font-size: 3rem; margin-bottom: 0.5rem; color: var(--danger);">
        ⚠️
    </div>

    <h1 style="color: var(--danger); font-size: 1.8rem; margin-bottom: 1rem;">
        Delete Book
    </h1>

    <p style="font-size: 1.1rem; color: var(--text-main); margin-bottom: 2rem;">
        Are you sure you want to delete <br>
        <strong style="color: #ffffff; font-size: 1.2rem;">"{{ book.title }}"</strong>?
    </p>

    <form method="post">

        {% csrf_token %}

        <div class="delete-actions">
            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'book-detail' book.slug %}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
